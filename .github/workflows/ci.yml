name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f Containerfile -t hello-world .

      - name: Smoke test
        run: |
          docker run --rm -d -p 8080:80 --name hello-world hello-world
          curl -fsS http://127.0.0.1:8080 | grep -q "Hello World"
          docker stop hello-world
